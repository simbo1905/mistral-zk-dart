<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPAQUE Export Key Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      padding: 16px;
      background: #f8f9fa;
      color: #1a1a1a;
      min-width: 300px;
      font-size: 14px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .server-url {
      font-size: 12px;
      color: #666;
      margin-bottom: 16px;
    }
    .section {
      background: #fff;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .section h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #444;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      background: #fff;
      color: #1a1a1a;
      font-size: 13px;
      margin-bottom: 10px;
    }
    input:focus {
      outline: none;
      border-color: #0969da;
      box-shadow: 0 0 0 2px rgba(9,105,218,0.15);
    }
    .pin-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 12px 0;
    }
    .pin-digit {
      width: 36px;
      height: 44px;
      border: 2px solid #d0d7de;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
      background: #fff;
      transition: all 0.15s;
    }
    .pin-digit.filled {
      border-color: #0969da;
      background: #f0f7ff;
    }
    .format-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0;
      font-size: 12px;
    }
    .format-label {
      color: #666;
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: #444;
    }
    .radio-label input {
      margin: 0;
      width: auto;
    }
    .permutations {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 4px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #0969da;
      color: #fff;
    }
    .btn-primary:hover { background: #0860c7; }
    .btn-secondary {
      background: #f3f4f6;
      color: #1a1a1a;
      border-color: #d0d7de;
    }
    .btn-secondary:hover { background: #e9ecef; }
    .master-key-section {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #1a1a1a;
    }
    .master-key-section h2 { color: rgba(0,0,0,0.6); }
    .master-key-value {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 10px;
      background: #fff;
      color: #1a1a1a;
      padding: 10px;
      border-radius: 4px;
      word-break: break-all;
      line-height: 1.4;
      min-height: 36px;
    }
    .master-key-label {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 8px;
    }
    #log {
      background: #f6f8fa;
      border: 1px solid #e1e4e8;
      border-radius: 4px;
      padding: 10px;
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 11px;
      max-height: 150px;
      overflow-y: auto;
      line-height: 1.5;
    }
    .log-entry { margin-bottom: 4px; }
    .log-success { color: #1a7f37; }
    .log-error { color: #cf222e; }
    .log-info { color: #57606a; }
    .log-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }
    .log-footer a {
      font-size: 11px;
      color: #0969da;
      text-decoration: none;
      cursor: pointer;
    }
    .log-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>OPAQUE Export Key Demo</h1>
  <p class="server-url">Server: <span id="serverUrl">http://localhost:3456</span></p>
  
  <div class="section">
    <h2>Credentials</h2>
    <label for="username">Username</label>
    <input type="text" id="username" value="alice" />
    <label>PIN (auto-generated)</label>
    <div class="format-row">
      <span class="format-label">Format:</span>
      <label class="radio-label"><input type="radio" name="pinFormat" value="digits" checked> 6 digits</label>
      <label class="radio-label"><input type="radio" name="pinFormat" value="mixed"> 2 upper + 4 digits</label>
    </div>
    <div class="pin-container" id="pinContainer">
      <div class="pin-digit" id="pin0"></div>
      <div class="pin-digit" id="pin1"></div>
      <div class="pin-digit" id="pin2"></div>
      <div class="pin-digit" id="pin3"></div>
      <div class="pin-digit" id="pin4"></div>
      <div class="pin-digit" id="pin5"></div>
    </div>
    <div class="permutations" id="permutations"></div>
  </div>
  
  <div class="section">
    <h2>Actions</h2>
    <div class="btn-row" style="margin-bottom: 8px;">
      <button id="btnHealth" class="btn-secondary">Fetch Registered Users</button>
    </div>
    <div class="btn-row">
      <button id="btnRegister" class="btn-primary">Register</button>
    </div>
  </div>
  
  <div class="section master-key-section">
    <h2>Export Key</h2>
    <div id="masterKeyValue" class="master-key-value"></div>
    <div class="master-key-label">Derived via OPAQUE - never sent to server</div>
  </div>
  
  <div class="section">
    <h2>Log</h2>
    <div id="log"></div>
    <div class="log-footer">
      <a id="clearLog">Clear Log</a>
    </div>
  </div>
  
  <script type="module" src="sidebar.js"></script>
</body>
</html>
